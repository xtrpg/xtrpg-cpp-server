name: Automated Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to see full git tag history

      # Automatically calculate the next version string based on commits
      - name: Calculate Next Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"

      # Pass the calculated version variable straight into the CMake config
      - name: Configure CMake with New Version
        run: |
          cmake -B build -S . \
            -DBUILD_VERSION="${{ steps.semver.outputs.version }}" \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ Binary
        run: cmake --build build --config Release

      # Create the Git Tag and GitHub Release matching the calculated version
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.version }}
          name: Release v${{ steps.semver.outputs.version }}
          body: |
            Automated release generated by GitHub Actions.
            Version: ${{ steps.semver.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}