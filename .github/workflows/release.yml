name: Automated Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # Fetch the official vcpkg repo directly
      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: "https://github.com/Microsoft/vcpkg"
          path: "vcpkg"

      - name: Bootstrap vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.sh
        shell: bash

      # Set up GitHub Actions Cache for vcpkg binary caching
      - name: Setup vcpkg Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            ~/.vcpkg
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # Automatically calculate the next version string based on commits
      - name: Calculate Next Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"

      # Configure CMake passing the vcpkg toolchain file
      - name: Configure CMake with New Version
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DBUILD_VERSION="${{ steps.semver.outputs.version }}" \
            -DCMAKE_BUILD_TYPE=Release

      # Build the C++ Binary
      - name: Build C++ Binary
        run: cmake --build build --config Release

      # Create the Git Tag and GitHub Release matching the calculated version
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.version }}
          name: Release v${{ steps.semver.outputs.version }}
          body: |
            Automated release generated by GitHub Actions.
            Version: ${{ steps.semver.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}