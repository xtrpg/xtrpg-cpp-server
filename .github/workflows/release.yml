name: Automated Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: 'microsoft/vcpkg'
          ref: '2026.07.29'
          path: 'vcpkg'

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory '*'

      # Set up vcpkg executable and binary cache
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Uses the vcpkg.json in the repository root 
          vcpkgJsonGlob: 'vcpkg.json'

      # Automatically calculate the next version string based on commits
      - name: Calculate Next Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"

      # Configure CMake passing the vcpkg toolchain file
      - name: Configure CMake with New Version
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DBUILD_VERSION="${{ steps.semver.outputs.version }}" \
            -DCMAKE_BUILD_TYPE=Release

      # Build the C++ Binary
      - name: Build C++ Binary
        run: cmake --build build --config Release

      # Create the Git Tag and GitHub Release matching the calculated version
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.version }}
          name: Release v${{ steps.semver.outputs.version }}
          body: |
            Automated release generated by GitHub Actions.
            Version: ${{ steps.semver.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}